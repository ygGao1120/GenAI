[project]
name = "llmlab"
version = "0.1.0"
description = "Personal LLM training and fine-tuning lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # torch is pinned to the version current vLLM requires, so vLLM can be added later.
    # Version floors stop the resolver from backtracking to stale releases.
    "torch==2.13.*",
    "transformers>=5.19",
    "datasets>=5.1",
    "accelerate>=1.15",
    "peft>=0.21",
    "trl>=1.15",
    "bitsandbytes>=0.50; sys_platform == 'linux'",
    "omegaconf>=2.3",
    "wandb>=0.30",
    "einops>=0.8",
]

[dependency-groups]
dev = ["pytest", "ruff"]
notebook = ["ipykernel", "matplotlib", "pandas", "nbstripout"]

[tool.uv]
default-groups = ["dev", "notebook"]

# CUDA 13.0 wheels match the Lambda A100 driver (580, CUDA 13.0) and PyPI's vLLM builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmlab", "src/cs336"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "slow: long-running test",
]
